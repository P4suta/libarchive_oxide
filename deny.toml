# Supply-chain policy for `cargo deny check`.

[graph]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
db-path = "target/advisory-dbs"
yanked = "deny"
# RPM verification accepts SignedPublicKey certificates and exposes no private-key operation.
# Both timing advisories concern arithmetic on secret integers.
# Remove these exceptions when rPGP adopts fixed crypto dependencies.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0387"]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "MIT",
  # ppmd-rust is dual MIT-0 OR CC0-1.0; accept the attribution-compatible MIT-0 branch used by the bounded 7z PPMd7 adapter.
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSD-2-Clause",
  "bzip2-1.0.6",
  # ring and its untrusted parser dependency use the short permissive ISC license for their bounded CMS signature-verification implementation.
  "ISC",
  # cryptographic-message-syntax and x509-certificate use MPL-2.0.
  # They are unmodified, library-only CMS/X.509 adapters behind libarchive_oxide-package's bounded offline verification boundary; the optional HTTP feature is disabled.
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Applies only to workspace path dependencies.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = [{ name = "openssl" }, { name = "openssl-sys" }]
skip = [
  { crate = "lzma-rust2@0.18.1", reason = "stock sevenz-rust2 oracle uses its independent LZMA API" },
  { crate = "zstd@0.13.4", reason = "stock sevenz-rust2 oracle uses the Zstandard 0.13 API" },
  { crate = "zstd-safe@7.4.0", reason = "stock sevenz-rust2 oracle uses the Zstandard 7 API" },
  # cap-std 4 pulls io-lifetimes v2 through fs-set-times while its current io-extras path uses v3.
  # Both are internal compatibility layers.
  { crate = "io-lifetimes@2.0.4", reason = "transitive cap-std compatibility split; no workspace crate uses this API" },
  # x509-certificate 0.25 still uses the stable DER 0.7 / const-oid 0.9 family, while digest 0.11 has moved to const-oid 0.10.
  { crate = "const-oid@0.9.6", reason = "bounded CMS/X.509 parser is on DER 0.7 while the workspace digest family independently uses const-oid 0.10" },
]
skip-tree = [
  # The cap-std/tempfile Windows dependency graph spans three windows-sys release lines.
  # These target bindings do not coexist in one API surface and are expected to converge only when their upstream crates do.
  { crate = "windows-sys", reason = "foundational target bindings versioned independently by cap-std and tempfile transitive dependencies" },
  # rPGP 0.21 is on RustCrypto digest/cipher 0.10 while the archive codecs have moved to 0.11.
  # These types stay behind the private RPM OpenPGP verifier and never cross a workspace public API boundary.
  { crate = "pgp@0.21.0", reason = "bounded RPM OpenPGP verifier uses rPGP's isolated RustCrypto 0.10 graph alongside workspace RustCrypto 0.11" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
