# Install tools with `mise install`. Rust configuration is in rust-toolchain.toml.

[tools]
rust = { version = "1.99.1", components = ["clippy", "rustfmt"] }

lefthook = "2.2.2"
committed = "1.1.12"
just = "1.59.0"
jq = "1.8.2"

typos = "1.52.2"
actionlint = "1.7.12"
zizmor = "1.32.0"

# REUSE runs through uvx.
uv = "0.13.7"

cargo-binstall = "1.27.0"

"cargo:cargo-msrv" = "0.19.6"
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-hack" = "0.6.46"
"cargo:cargo-nextest" = "0.9.151"
"cargo:cargo-shear" = "1.14.0"

[settings.cargo]
binstall = true

[tasks.hooks]
description = "Install the git hooks (see lefthook.yml)"
run = "lefthook install"
