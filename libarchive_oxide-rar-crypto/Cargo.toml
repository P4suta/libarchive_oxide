[package]
name = "libarchive_oxide-rar-crypto"
version.workspace = true
description = "bounded Safe-Rust RAR cryptographic primitives for libarchive_oxide"
edition.workspace = true
rust-version.workspace = true
license = "ISC"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/libarchive_oxide-rar-crypto"
keywords = ["archive", "cryptography", "rar", "no-std", "embedded"]
categories = ["cryptography", "no-std"]

[dependencies]
aes = { version = "0.9.4", default-features = false, features = ["zeroize"] }
cbc = { version = "0.2", default-features = false, features = ["zeroize"] }
hmac = { version = "0.13", default-features = false }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha1 = { version = "0.11", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
subtle = { version = "2.6.1", default-features = false }
zeroize = { version = "1.8.2", default-features = false, features = ["alloc"] }

[lints]
workspace = true
