name = "libarchive_oxide"
summary = "Read and write archives with a Rust library and command-line tool"
install = """
git clone https://github.com/P4suta/libarchive_oxide.git
cd libarchive_oxide
mise install rust
mise x -- cargo install --path libarchive_oxide-cli --locked
"""
usage_language = "sh"
usage = "oxarchive capabilities --json"
documentation_index = true
copyright = "2026 libarchive_oxide contributors"
license = "MIT OR Apache-2.0"

