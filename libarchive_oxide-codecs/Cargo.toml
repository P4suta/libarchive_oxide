[package]
name = "libarchive_oxide-codecs"
version.workspace = true
description = "no_std + alloc portable codecs for libarchive_oxide"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/libarchive_oxide-codecs"
keywords = ["archive", "compression", "codec", "no-std", "embedded"]
categories = ["compression", "no-std"]
exclude = ["tests/"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
aes7z = ["dep:aes", "dep:cbc", "dep:sha2", "dep:zeroize"]
bcj = []
delta = []
deflate = ["dep:miniz_oxide"]
gzip = ["deflate"]
lz4 = ["dep:lz4_flex", "dep:twox-hash"]
lzw = ["dep:compcol"]
lzx = []
zstd = ["dep:ruzstd"]

[dependencies]
libarchive_oxide-core = { path = "../libarchive_oxide-core", version = "0.2.0" }
aes = { version = "0.9", default-features = false, features = ["zeroize"], optional = true }
cbc = { version = "0.2", default-features = false, features = ["zeroize"], optional = true }
compcol = { version = "=0.6.8", default-features = false, features = ["lzw"], optional = true }
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"], optional = true }
lz4_flex = { version = "0.14.0", default-features = false, features = ["alloc", "checked-decode", "safe-decode", "safe-encode"], optional = true }
ruzstd = { version = "0.9.0", default-features = false, features = ["hash"], optional = true }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"], optional = true }
twox-hash = { version = "2.1.3", default-features = false, features = ["xxhash32"], optional = true }
zeroize = { version = "1.8.2", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
flate2 = { version = "1.1.9", default-features = false, features = ["zlib"] }
lzma-rust2 = "0.18.0"

[lints]
workspace = true
