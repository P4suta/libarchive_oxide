# CodeQL security analysis (Advanced Setup). Scans the Rust source and the repository's own GitHub
# Actions workflows, uploading results to Security > Code scanning. Advanced (not Default) setup keeps
# the language set, query suite, and SHA-pinned action versions in-repo under the same review as the
# code — matching this repo's "pin every action" convention.
#
# Languages:
#   - rust    the archive library itself (build-mode: none — the only mode the Rust analysis
#             supports; it resolves the cargo workspace without a traced build, so the excluded
#             nightly-only fuzz crate never has to build here).
#   - actions the workflows under .github/workflows (catches injection / unsafe checkout / token-scope
#             issues in the CI YAML).
name: CodeQL

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write # upload the SARIF results to code scanning
      actions: read # Read workflow metadata for code scanning.
      contents: read # Read repository source for analysis.
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Broader security rule set than the default suite.
          queries: security-extended
      - name: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{ matrix.language }}"
