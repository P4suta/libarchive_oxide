# CI for libarchive_oxide (safe-Rust unified archive library).
#
# Layout under test: five publishable crates + an excluded fuzz sub-workspace.
#   - libarchive_oxide-core   no_std + alloc, zero external deps (sans-I/O state machines).
#   - libarchive_oxide-codecs no_std + alloc, additive portable codec state machines.
#   - libarchive_oxide        the std flagship (auto-detection, FS extraction, safe paths, codecs).
#   - libarchive_oxide-package ecosystem package rules and offline verification.
#   - libarchive_oxide-cli    the unified oxarchive command.
#   - xtask                   portable repository-policy checks used by Just and CI.
#   - fuzz/                   cargo-fuzz targets; outside the workspace, nightly-only.
#
# Policy:
#   - Every third-party action is SHA-pinned (Dependabot bumps them weekly); the comment records
#     the human-readable version. `dtolnay/rust-toolchain@stable` is likewise pinned by commit.
#   - `Swatinem/rust-cache` over raw `actions/cache` for the cargo state.
#   - A single `ci-required` aggregation gate is the one status context branch protection references,
#     so the ruleset never desyncs as jobs are added or renamed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref to keep the queue lean.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # NOTE: `-D warnings` is applied *per job*, only on the stable toolchain we can reproduce locally
  # (fmt/clippy/test/32-bit/no_std/doc). It is deliberately NOT global: the msrv (cargo-msrv installs
  # 1.88), fuzz (nightly), and big-endian (cross/qemu) jobs run toolchains or emulators the dev box
  # cannot reproduce, and a version-specific warning from the compiler or a dependency there would
  # turn CI red for a reason invisible to every local gate. Those jobs still fail on real errors.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: just@1.50.0
      - run: just fmt-check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: just lint

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Each maximal profile includes the bounded, target-sharded invariant replay, followed by
    # doctests. Keep the job ceiling above two complete profiles while nextest's per-test timeout
    # still catches individual hangs.
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
      NEXTEST_TEST_THREADS: ${{ matrix.test_threads }}
      RUST_TEST_THREADS: ${{ matrix.test_threads }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            test_threads: 4
          - os: windows-latest
            test_threads: 4
          # Pure-Rust preset-6 XZ cases contend heavily on the macOS runner when libtest schedules
          # them together. Serial execution is faster and makes the last printed test causal.
          - os: macos-latest
            test_threads: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: just@1.50.0,nextest@0.9.140
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Nextest runs the normal conformance and committed fuzz-replay corpus process-per-test
      # through both maximal profiles. Cargo follows each profile with its doctests.
      - run: just test-ci

  streaming-soak:
    name: 10 GiB tar/gzip/xz/zstd soak (peak RSS <= 128 MiB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTFLAGS: -D warnings
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Each test synthesizes a raw tar or repeats one small compressed frame on demand, consumes
      # all 10 GiB through ArchiveReader, and reads Linux VmHWM after completion. No archive-sized
      # file, compressed fixture, or allocation is ever created.
      - run: just streaming-soak

  feature-matrix:
    name: feature matrix (cargo-hack, all targets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: just@1.50.0,cargo-hack@0.6.45
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: just feature-matrix

  check-32-bit-windows:
    name: check (i686 Windows, portable + native)
    runs-on: windows-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: i686-pc-windows-msvc
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: just check-32-bit-windows

  no_std:
    name: no_std (thumbv7em)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: thumbv7em-none-eabi
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Core and all portable codec features must stay no_std + alloc. Building both for a
      # bare-metal target with no std available proves the physical crate boundary.
      - run: just no-std

  wasi:
    name: WASI inspection stack (wasm32-wasip1)
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-wasip1
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # This is compile-only: archive inspection and portable codecs must remain
      # usable without enabling native libraries or filesystem extraction.
      - run: just wasi

  doc:
    name: doc (rustdoc, warnings are errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: just@1.50.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Intra-doc links and doctests across the whole public surface. Keep in sync with docs.yml
      # (which additionally deploys the result to Pages).
      - env:
          RUSTDOCFLAGS: -D warnings
        run: just doc

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1

  msrv:
    name: msrv (workspace 1.88, including no_std)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-msrv@0.19.3
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: just@1.50.0
      # `cargo-msrv verify` reads each crate's declared `rust-version` and proves it actually builds
      # on that floor (installing the toolchain via rustup). Every workspace member uses the
      # same 1.88 floor; core and portable codecs are additionally built as no_std + alloc.
      - name: verify declared MSRVs
        run: just msrv

  registry:
    name: object-safe registry conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: just@1.50.0
      # Boxed downstream providers retain the common bounded incremental protocol,
      # duplicate-ID rejection, and capability semantics.
      - run: just registry

  reuse:
    name: reuse (SPDX/REUSE compliance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: just@1.50.0
      # Run REUSE through `uvx` exactly as `just reuse` does locally, instead of the
      # `fsfe/reuse-action` Docker action. That action pulled `fsfe/reuse` from Docker Hub at run
      # time, whose image-manifest fetch intermittently timed out and turned `ci-required` red for a
      # network reason unrelated to compliance. PyPI (uv/reuse) is far more reliable than anonymous
      # Docker Hub pulls, and running the same command as local keeps CI and the dev box from drifting.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.11.32
      - run: just reuse

  license-sync:
    name: crate package, codec and release policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: just@1.50.0
      - run: just license-sync
      - name: verify license texts are packaged
        run: just package-licenses
      - name: compile packaged crates from an external consumer
        run: just package-smoke
      - name: verify portable exclusion and explicit native codec backends
        run: just codec-policy
      - name: verify generated capability documentation
        run: just capability-docs
      - name: verify manual draft-first release policy
        run: just release-policy

  deny:
    name: dependency policy (cargo-deny + cargo-shear)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-deny@0.20.2,cargo-shear@1.13.3
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: just@1.50.0
      - run: just deny
      - run: just shear

  fuzz:
    name: fuzz (nightly, build + short run)
    runs-on: ubuntu-latest
    # The 27-target inventory receives 30 seconds per portable target and 10
    # seconds per native target (18 minutes total) after two complete builds.
    timeout-minutes: 30
    env:
      # cargo-binstall distributes cargo-fuzz as a musl-linked executable. Explicitly select the
      # runner's GNU target so cargo-fuzz does not mistake its own build target for the fuzz target;
      # ASan is incompatible with a statically linked musl libc.
      FUZZ_TARGET: x86_64-unknown-linux-gnu
      # Keep malformed length arithmetic fail-closed in panic-abort tests and libFuzzer builds.
      RUSTFLAGS: -C overflow-checks=yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cargo-fuzz@0.13.2
      # libFuzzer needs nightly + the sanitizer runtime. Pin the dated official
      # toolchain so an unrelated nightly update cannot change this required gate.
      # The fuzz crate is outside the workspace, so it carries its own lockfile.
      - name: install pinned nightly (libFuzzer)
        run: rustup toolchain install nightly-2026-07-29 --profile minimal --no-self-update
      # A panic in a dependency must fail as a process abort here as it does under libFuzzer.
      # Overflow checks keep malformed length arithmetic on the same fail-closed path.
      # Both profiles run the same target list and committed corpus. The portable budget remains the
      # deeper default campaign; native gets a shorter differential run on the identical seeds.
      - name: panic-abort regressions and bounded fuzz campaign
        run: cargo run --quiet -p xtask -- fuzz-ci

  big-endian:
    name: big-endian (s390x, qemu)
    # The archive formats carry big fields (zip is little-endian, tar is ASCII-octal, cpio/7z/iso
    # mix endian): a byte-order bug hides on the little-endian CI matrix. `cross` runs both library
    # suites under qemu on a big-endian target to surface it. The CLI contract suite is excluded
    # because it spawns target binaries as child processes, bypassing cross's top-level qemu runner.
    # Promoted to a required gate after three consecutive green runs on main. Stable/native replay
    # and nightly libFuzzer already cover the full corpus; skip those CPU-heavy invariant batches
    # under QEMU so this debug-profile gate remains focused on byte-order behavior without paying
    # release-profile codegen cost for platform-specific filesystem code. The one-byte XZ writer
    # case remains in every native OS job; under QEMU it measures encoder throughput rather than
    # byte-order behavior and takes over 20 minutes. The xtask owns both command lines and the skip
    # list so CI and local reproduction cannot drift apart.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: cross@0.2.5
      - name: compile big-endian s390x test binaries
        run: cargo run --quiet -p xtask -- big-endian-ci-compile
      - name: test suite on big-endian s390x under qemu
        run: cargo run --quiet -p xtask -- big-endian-ci

  actionlint:
    name: actionlint + zizmor (workflow self-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2.87.9
        with:
          tool: just@1.50.0,zizmor@1.28.0
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          # Official digest published on the v1.7.12 GitHub Release asset.
          ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          archive="$RUNNER_TEMP/$asset"
          curl --fail --show-error --location --retry 5 --retry-connrefused \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$asset"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$archive" |
            sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: zizmor (offline, high severity)
        run: just zizmor

  # Single aggregation gate. `if: always()` makes failures and cancellations
  # visible through the one branch-protection status.
  ci-required:
    name: ci-required
    if: always()
    needs:
      - fmt
      - clippy
      - test
      - streaming-soak
      - feature-matrix
      - check-32-bit-windows
      - no_std
      - wasi
      - doc
      - typos
      - msrv
      - registry
      - reuse
      - license-sync
      - deny
      - fuzz
      - big-endian
      - actionlint
    runs-on: ubuntu-latest
    steps:
      - name: verify all required jobs passed (skipped counts as pass)
        run: |-
          results="${{ join(needs.*.result, ' ') }}"
          echo "needs results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required job did not pass ($r)"
              exit 1
            fi
          done
          echo "all required jobs passed"
