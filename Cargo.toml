[workspace]
resolver = "2"
members = [
    "libarchive_oxide-core",
    "libarchive_oxide-codecs",
    "libarchive_oxide",
    "libarchive_oxide-package",
    "libarchive_oxide-cli",
    "xtask",
]
# cargo-fuzz requires nightly and a sanitizer runtime.
exclude = ["fuzz"]

[workspace.package]
version = "0.2.0"
edition = "2024"
# Workspace-wide floor required by the audited compcol Quantum decoder.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Yasunobu Sakashita <crates.tank733@slmails.com>"]
repository = "https://github.com/P4suta/libarchive_oxide"
homepage = "https://github.com/P4suta/libarchive_oxide"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Production code must not use unwrap, expect, panic, or unreachable fallbacks.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unreachable = "warn"
missing_errors_doc = "allow"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
