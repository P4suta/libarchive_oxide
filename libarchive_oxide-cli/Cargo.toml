[package]
name = "libarchive_oxide-cli"
autobins = false
autotests = false
version.workspace = true
description = "Unified safe archive and package CLI"
edition.workspace = true
# Workspace MSRV inherited from codec dependencies.
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/libarchive_oxide-cli"
keywords = ["archive", "tar", "zip", "cpio", "cli"]
categories = ["command-line-utilities"]

[package.metadata.docs.rs]
no-default-features = true
features = ["portable-codecs"]

[features]
default = ["portable-codecs"]
portable-codecs = [
    "libarchive_oxide/portable-codecs",
    "libarchive_oxide-package/portable-codecs",
]
native-codecs = [
    "libarchive_oxide/native-codecs",
    "libarchive_oxide-package/native-codecs",
]

# Command-line entry points.
[[bin]]
name = "oxarchive"
path = "src/bin/oxarchive.rs"

[[test]]
name = "oxarchive"
path = "tests/oxarchive.rs"

[[test]]
name = "oci_cli"
path = "tests/oci_cli.rs"

[[test]]
name = "package_cli"
path = "tests/package_cli.rs"

[dependencies]
# Enable CLI-supported formats.
libarchive_oxide = { path = "../libarchive_oxide", version = "0.2.0", default-features = false, features = ["aes", "sevenz"] }
libarchive_oxide-package = { path = "../libarchive_oxide-package", version = "0.2.0", default-features = false }
libarchive_oxide-core = { path = "../libarchive_oxide-core", version = "0.2.0" }
cap-std = "4.0.2"
rpassword = "7.5.4"
serde_json = "1.0.149"
zeroize = "1.8.2"

[lints]
workspace = true
