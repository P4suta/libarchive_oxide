# Install with `mise run hooks`.

min_version: 2.1.9
assert_lefthook_installed: true
no_tty: false
colors: true

commit-msg:
  commands:
    conventional:
      run: mise exec -- committed --commit-file {1}

pre-commit:
  parallel: false
  follow: true
  commands:
    cargo-fmt:
      tags: format
      glob: "*.rs"
      run: mise exec -- just fmt
      stage_fixed: true

    typos:
      tags: spell
      # `typos.toml` excludes these during repository walks; repeat the filter here because this hook passes staged paths explicitly.
      exclude:
        - "libarchive_oxide/vendor/delharc/*"
        - "libarchive_oxide/vendor/delharc/**/*"
        - "libarchive_oxide/vendor/sevenz-rust2/*"
        - "libarchive_oxide/vendor/sevenz-rust2/**/*"
        # `typos --write-changes` can rewrite coincidental word fragments in a binary even when its type has `check-file = false`.
        # Keep every byte-exact archive/key/signature fixture out of the mutating hook.
        - "*.{tar,tgz,cpio,ar,a,zip,7z,iso,gz,zst,xz,lz4,lzip,bin,cab,rar,udf,xar,rpm,deb,apk,appx,msix,nupkg,idsig,b64,pub,asc,exe,pdb}"
        - "**/*.{tar,tgz,cpio,ar,a,zip,7z,iso,gz,zst,xz,lz4,lzip,bin,cab,rar,udf,xar,rpm,deb,apk,appx,msix,nupkg,idsig,b64,pub,asc,exe,pdb}"
      run: mise exec -- typos --write-changes {staged_files}
      stage_fixed: true

    clippy:
      tags: lint
      glob: "*.rs"
      run: mise exec -- just lint-portable
      fail_text: "Host Clippy failed; fix every warning before committing."


    reuse:
      tags: license
      glob: "{**/*.rs,**/*.toml,**/*.md,**/*.yml,Justfile,REUSE.toml,**/LICENSES/*}"
      run: mise exec -- just reuse

    license-sync:
      tags: license
      glob: "{LICENSES/*,**/LICENSES/*}"
      run: mise exec -- just license-sync

pre-push:
  parallel: false
  follow: true
  commands:
    local-ci:
      tags: ci
      run: mise exec -- just ci
      fail_text: "Local CI failed; fix the reported gate before pushing."

# Explicit manual entry point: `lefthook run local-ci`.
local-ci:
  parallel: false
  follow: true
  commands:
    all:
      tags: ci
      run: mise exec -- just ci
